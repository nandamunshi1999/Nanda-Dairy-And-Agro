name: Build PWA Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-33 build-tools;33.0.2'
        accept-android-sdk-licenses: true

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Initialize and Build TWA APK Non-interactively
      run: |
        printf "n\n%s\n/usr/local/lib/android/sdk\nn\n" "$JAVA_HOME" | bubblewrap init --manifest https://nandamunshi1999.github.io/Nanda-Dairy-And-Agro/manifest.json --directory ./twa
        cd twa
        printf "n\n" | bubblewrap build --skipKeytool

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nanda-dairy-apk
        path: ./twa/**/*.apk
