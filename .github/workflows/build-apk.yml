name: Convert Web App to APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Nativefier or Webview Builder
      run: |
        npm install -g nativefier

    - name: Build APK for Nanda Dairy & Agro
      run: |
        nativefier --name "Nanda Dairy & Agro" "https://nandamunshi1999.github.io/Nanda-Dairy-And-Agro/" --platform android --arch arm64 --out ./apk-output

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nanda-dairy-apk
        path: ./apk-output/**/*.apk
