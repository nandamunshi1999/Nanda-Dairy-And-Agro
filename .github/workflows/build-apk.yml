name: Build PWA Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-33 build-tools;33.0.2'
        accept-android-sdk-licenses: true

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Create TWA Manifest File
      run: |
        cat << EOF > twa-manifest.json
        {
          "packageId": "com.nandadairy.agro.twa",
          "host": "nandamunshi1999.github.io",
          "name": "Nanda Dairy & Agro",
          "shortName": "Nanda Dairy",
          "startUrl": "/Nanda-Dairy-And-Agro/",
          "iconUrl": "https://nandamunshi1999.github.io/Nanda-Dairy-And-Agro/logo.png",
          "appVersion": "1.0.0",
          "appVersionCode": 1,
          "themeColor": "#1b5e20",
          "backgroundColor": "#ffffff",
          "display": "standalone",
          "orientation": "default",
          "generatorApp": "bubblewrap-cli",
          "webManifestUrl": "https://nandamunshi1999.github.io/Nanda-Dairy-And-Agro/manifest.json",
          "fallbackType": "customtab",
          "signingKey": {
            "path": "android.keystore",
            "alias": "android"
          },
          "trustWebActivity": {
            "host": "nandamunshi1999.github.io"
          }
        }
        EOF

    - name: Build TWA APK with Smart Automation
      run: |
        node -e '
          const { spawn } = require("child_process");
          const child = spawn("bubblewrap", ["build", "--manifest", "twa-manifest.json", "--skipKeytool"], {
            env: process.env,
            stdio: ["pipe", "pipe", "pipe"]
          });
          child.stdout.on("data", (data) => {
            process.stdout.write(data);
            const out = data.toString();
            if (out.includes("Do you want Bubblewrap to install the JDK")) {
              child.stdin.write("n\n");
            } else if (out.includes("Path to your existing JDK")) {
              child.stdin.write(process.env.JAVA_HOME + "\n");
            }
          });
          child.stderr.on("data", (data) => {
            process.stderr.write(data);
          });
          child.on("close", (code) => {
            process.exit(code);
          });
        '

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nanda-dairy-apk
        path: app-release-signed.apk
